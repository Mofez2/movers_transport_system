{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Movers Transport</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(120deg, #6f42c1, #0d6efd);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .reset-wrapper {
      background: #fff;
      width: 95%;
      max-width: 450px;
      border-radius: 20px;
      padding: 40px 35px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      animation: fadeIn 1s ease;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reset-wrapper img {
      width: 80px;
      margin-bottom: 15px;
      border-radius: 50%;
      background: #fff;
      padding: 5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .reset-wrapper h3 {
      font-weight: 600;
      margin-bottom: 10px;
      color: #2c2c2c;
    }

    .reset-wrapper p {
      color: #777;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: linear-gradient(90deg, #6f42c1, #0d6efd);
      border: none;
      border-radius: 10px;
      padding: 12px;
      width: 100%;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      font-weight: 500;
      color: #6f42c1;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="reset-wrapper">
    <img src="{% static 'core/images/logo.png' %}" alt="Movers Logo">
    <h3>Reset Your Password</h3>
    <p>Enter your email below, and we’ll send you a link to reset your password.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary mt-2">Send Reset Link</button>
    </form>

    <a href="{% url 'user_login' %}" class="back-link"><i class="bi bi-arrow-left"></i> Back to Login</a>
  </div>

</body>
</html>
