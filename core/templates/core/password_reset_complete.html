{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete | Movers Transport</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(120deg, #6f42c1, #0d6efd);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .complete-wrapper {
      background: #fff;
      width: 95%;
      max-width: 450px;
      border-radius: 20px;
      padding: 40px 35px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      animation: fadeIn 1s ease;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .complete-wrapper img {
      width: 80px;
      margin-bottom: 15px;
      border-radius: 50%;
      background: #fff;
      padding: 5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .complete-wrapper h4 {
      font-weight: 600;
      color: #2c2c2c;
    }

    .complete-wrapper p {
      color: #777;
      font-size: 0.9rem;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .btn-primary {
      background: linear-gradient(90deg, #6f42c1, #0d6efd);
      border: none;
      border-radius: 10px;
      padding: 12px;
      width: 100%;
      font-weight: 500;
      color: white;
      transition: 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="complete-wrapper">
    <img src="{% static 'core/images/logo.png' %}" alt="Movers Logo">
    <h4 class="text-success"><i class="bi bi-check-circle-fill me-2"></i>Password Reset Successful!</h4>
    <p>Your password has been changed successfully. You can now log in with your new password.</p>
    <a href="{% url 'user_login' %}" class="btn btn-primary">
      <i class="bi bi-box-arrow-in-right me-1"></i> Go to Login
    </a>
  </div>

</body>
</html>
