<div id="chatbot" class="chat-box">
    <div id="chat-log"></div>
    <input id="chat-input" type="text" placeholder="Ask something..." />
</div>

<style>
.chat-box {
    position: fixed; bottom: 20px; right: 20px;
    background: white; width: 280px; border-radius: 10px;
    border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
#chat-log { max-height: 250px; overflow-y: auto; padding: 10px; }
#chat-input { width: 100%; border: none; padding: 10px; border-top: 1px solid #ccc; }
</style>

<script>
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');

function addMessage(text, sender='bot') {
  const div = document.createElement('div');
  div.textContent = `${sender === 'bot' ? '🤖' : '🧍‍♂️'} ${text}`;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

chatInput.addEventListener('keypress', e => {
  if (e.key === 'Enter' && chatInput.value.trim()) {
    const msg = chatInput.value;
    addMessage(msg, 'user');
    chatInput.value = '';

    if (msg.toLowerCase().includes('price')) {
      addMessage('Enter your pickup and dropoff addresses above to see your estimated price.');
    } else if (msg.toLowerCase().includes('track')) {
      addMessage('Go to your bookings page to track your delivery.');
    } else {
      addMessage("I can help with pricing and tracking. Try typing 'price' or 'track'.");
    }
  }
});
</script>
