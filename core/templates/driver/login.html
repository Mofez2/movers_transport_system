{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Login | Movers Transport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url("{% static 'images/login_bg.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            font-family: "Poppins", sans-serif;
        }
        .login-box {
            max-width: 400px;
            margin: 120px auto;
            padding: 30px;
            background: rgba(0,0,0,0.6);
            border-radius: 15px;
            backdrop-filter: blur(8px);
            color: #fff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
        .title {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">
    <div class="title mb-3">🚚 Driver Login</div>

    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label class="mb-1">Email or Username</label>
        <input type="text" name="username" class="form-control mb-3" placeholder="Enter your email or username" required>

        <label class="mb-1">Password</label>
        <input type="password" name="password" class="form-control mb-3" placeholder="Enter password" required>

        <button class="btn btn-primary btn-login">Log In</button>
    </form>

    <div class="text-center mt-3">
        <a href="/" class="text-info">Back to Home</a>
    </div>
</div>

</body>
</html>
